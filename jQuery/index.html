<!DOCTYPE html>
<html>

<head>
    <title>jQuery - Snake</title>
    <meta charset='UTF-8'>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <h1>Use jQuery to Manipulate the Snake!</h1>
    <p>Click the buttons below!</p>
    <div class="controls">
        <button id='animator'>Animate</button>
        <button id='reset'>Reset</button>
        <button id='fader'>Fade in/out</button>
        <button id='hide'>Hide</button>
        <button id='show'>Show</button>
        <button id='grow'>Add a segment</button>
    </div>
    <br>
    <div id='caterpillar'>
        <div id='tail' class='body'></div>
        <div id='head'></div>
    </div>
</body>

</html>
