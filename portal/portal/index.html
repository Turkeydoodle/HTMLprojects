<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="card">
        <h1>My Task Portal</h1>

        <!-- Shown when the user is logged out -->
        <section id="auth-section">
            <label for="email">Email</label>
            <input
                id="email"
                type="email"
                placeholder="student@example.com"
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                placeholder="At least 6 characters"
            >

            <div class="button-group">
                <button id="signup-button">Create Account</button>
                <button id="login-button">Log In</button>
            </div>

            <button id="reset-button" class="link-button">
                Forgot password?
            </button>
        </section>

        <!-- Shown when the user is logged in -->
        <section id="account-section" class="hidden">
            <h2>Welcome!</h2>
        
            <p>You are logged in as:</p>
            <p id="user-email"></p>
        
            <div class="task-form">
                <input
                    id="task-input"
                    type="text"
                    placeholder="Enter a new task"
                >
                <button id="add-task-button">Add Task</button>
            </div>
        
            <h3>My Tasks</h3>
            <ul id="task-list"></ul>
        
            <button id="logout-button">Log Out</button>
        </section>

        <p id="message" aria-live="polite"></p>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
